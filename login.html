<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Iniciar Sesión — INGEOCIMYC</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <main class="login-page">
      <h1>Iniciar sesión</h1>
      
      <form id="login-form" class="login-form">
        <label for="username">
          Usuario
          <input id="username" type="text" required>
        </label>
        
        <label for="password">
          Contraseña
          <input id="password" type="password" required>
        </label>
        
        <button class="btn primary" type="submit">Entrar</button>
        
        <div id="error-msg" class="form-error" aria-live="polite"></div>
      </form>

      <p class="login-info">
        <strong>Demo:</strong> admin / 1234<br>
        <small>⚠️ Solo con fines educativos. No es seguro para producción.</small>
      </p>
    </main>
  </div>

  <script src="auth.js"></script>
</body>
</html>
